<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Information Pillar — bare bones prototype</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background:#1b1b1f; color:#eee; padding:32px; margin:0; }
  .nav-row { text-align:center; margin-bottom:16px; }
  .nav-row a { color:#6fa8dc; font-size:12px; text-decoration:none; }
  .nav-row a:hover { text-decoration:underline; }
  .char-tag { text-align:center; font-size:12px; color:#888; margin-bottom:18px; }
  .char-tag b { color:#dcb96f; }
  h2 { text-align:center; font-weight:600; margin:0 0 6px; color:#ccc; }
  .subhead { text-align:center; font-size:12.5px; color:#888; margin-bottom:28px; }

  .add-row { display:flex; gap:8px; justify-content:center; margin-bottom:32px; flex-wrap:wrap; }
  .add-row input, .add-row select, .add-row button {
    background:#2a2a30; border:1px solid #444; color:#ddd; border-radius:5px;
    padding:8px 12px; font-size:13px;
  }
  #inf-subject { width:160px; }
  #inf-note { width:260px; }
  .add-row button { cursor:pointer; }
  .add-row button:hover { background:#35353d; border-color:#888; }

  .columns { display:flex; gap:40px; justify-content:center; align-items:flex-start; }
  .col { flex:1; max-width:420px; }
  .col-label { text-align:center; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#888; margin-bottom:4px; }
  .col-note { text-align:center; font-size:11.5px; color:#666; margin-bottom:14px; }
  .col-list { min-height:60px; border:2px dashed #444; border-radius:6px; padding:10px; background:#242429; }
  .col-list:empty::before { content:"— nothing held here yet —"; color:#555; font-size:13px; }

  .item { background:#2c2c33; border:1px solid #444; border-radius:6px; padding:9px 12px; margin-bottom:8px; font-size:13px; position:relative; }
  .item:last-child { margin-bottom:0; }
  .item .tag { color:#9fd0ff; font-weight:600; }
  .item .note { color:#ccc; display:block; margin-top:3px; }
  .item .remove { position:absolute; top:6px; right:9px; cursor:pointer; color:#888; font-size:12px; }
  .item .remove:hover { color:#e08080; }
</style>
</head>
<body>

<div class="nav-row"><a href="chemistry-pillar.html">&larr; Chemistry</a></div>
<div class="char-tag">Character A: <b id="char-name">&mdash;</b></div>

<h2>Information Pillar — bare bones prototype</h2>
<div class="subhead">A Character's own kit — gathered through play, not a fixed pool</div>

<div class="add-row">
  <input id="inf-subject" placeholder="((Subject))" />
  <select id="inf-scope">
    <option value="local">Local</option>
    <option value="global">Global / Retained</option>
  </select>
  <input id="inf-note" placeholder="What's actually known" />
  <button id="btn-add-info">Add</button>
</div>

<div class="columns">
  <div class="col">
    <div class="col-label">Local</div>
    <div class="col-note">situational — "check that sword out"</div>
    <div class="col-list" id="list-local"></div>
  </div>
  <div class="col">
    <div class="col-label">Global / Retained</div>
    <div class="col-note">persists, recallable later</div>
    <div class="col-list" id="list-global"></div>
  </div>
</div>

<script>
  // Bare-bones Information Pillar prototype — a Character's held kit, split
  // Local/Global per the Mechanics doc. Deliberately not wired to the
  // Exchange prototype yet, and deliberately not modeling Fog of War /
  // TATA authorship-asymmetry here — this pass only tests holding and
  // browsing a kit, nothing about how it gets perceived by someone else.
  let items = [];

  function render(){
    const local = document.getElementById('list-local');
    const global = document.getElementById('list-global');
    local.innerHTML = '';
    global.innerHTML = '';
    items.forEach((item, i) => {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML =
        '<span class="tag">((' + item.subject + '))</span>' +
        (item.note ? '<span class="note">' + item.note + '</span>' : '') +
        '<span class="remove" title="Remove">&times;</span>';
      el.querySelector('.remove').addEventListener('click', () => {
        items.splice(i, 1);
        render();
      });
      (item.scope === 'global' ? global : local).appendChild(el);
    });
  }

  document.getElementById('btn-add-info').addEventListener('click', () => {
    const subject = document.getElementById('inf-subject').value.trim();
    if(!subject) return;
    const scope = document.getElementById('inf-scope').value;
    const note = document.getElementById('inf-note').value.trim();
    items.push({ subject, scope, note });
    document.getElementById('inf-subject').value = '';
    document.getElementById('inf-note').value = '';
    render();
  });

  render();

  try {
    const c = JSON.parse(localStorage.getItem('gomsdu-chemistry-character') || 'null');
    if(c && c.name) document.getElementById('char-name').textContent = c.name;
  } catch(e){}
</script>

</body>
</html>
