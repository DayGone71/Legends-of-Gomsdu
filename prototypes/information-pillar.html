<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Information Pillar</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background:#1b1b1f; color:#eee; padding:32px; margin:0; }
  .nav-row { text-align:center; margin-bottom:32px; }
  .nav-row a { color:#6fa8dc; font-size:12px; text-decoration:none; }
  .nav-row a:hover { text-decoration:underline; }

  .ritual { width:180px; margin:0 auto; display:flex; flex-direction:column; align-items:center; }
  .glyph-slot { width:100px; color:#eee; }
  .glyph-slot svg { width:100%; height:auto; display:block; }
  .glyph-label { text-align:center; font-size:11px; color:#888; margin-top:4px; letter-spacing:.05em; }
  .line-slot { width:100px; color:#888; margin-top:14px; }
  .line-slot svg { width:100%; height:auto; display:block; }

  .receiving-box {
    width:180px; min-height:150px; margin:22px 0;
    border:2px dashed #444; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    background:#242429; color:#555; font-size:12px; text-align:center; padding:14px;
  }
</style>
</head>
<body>

<div class="nav-row"><a href="chemistry-pillar.html">&larr; Chemistry</a></div>

<div class="ritual">
  <div class="glyph-slot" id="slot-gi"></div>
  <div class="glyph-label">GI</div>

  <div class="glyph-slot" id="slot-ka" style="margin-top:16px;"></div>
  <div class="glyph-label">KA</div>

  <div class="glyph-slot" id="slot-m" style="margin-top:16px;"></div>
  <div class="glyph-label">M</div>

  <div class="line-slot" id="slot-yield-line"></div>

  <!-- The receiving mechanism isn't built yet — this box just needs to be
       able to display an Expression or a bare Glyph, whatever eventually
       feeds it. Static placeholder for now, no wiring. -->
  <div class="receiving-box" id="receiving-box">&mdash; nothing received yet &mdash;</div>

  <div class="glyph-slot" id="slot-w"></div>
  <div class="glyph-label">Yield: W</div>
</div>

<script>
  // Displays the Soul Injection Expression (GI + KA + M -> yield-line ->
  // Result: W) — the Subtle Aspect of the Animating Gate, per
  // gomsdu-codex.md. Read-only, straight from the Glyphic System JSON;
  // same render logic as gomsdu-glyph-viewer.html / archive.html.

  function primitiveMarkup(prim) {
    const r = prim.render;
    if (!r) return '';
    const strokeAttrs = 'fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter"';
    if (r.type === 'rect') {
      return '<rect x="' + r.x + '" y="' + r.y + '" width="' + r.width + '" height="' + r.height +
        '" rx="' + (r.rx || 0) + '" ' + strokeAttrs + '/>';
    }
    if (r.type === 'path') return '<path d="' + r.d + '" ' + strokeAttrs + '/>';
    if (r.type === 'multipath') return r.d.map(function (d) { return '<path d="' + d + '" ' + strokeAttrs + '/>'; }).join('');
    if (r.type === 'dots') return r.points.map(function (pt) { return '<circle cx="' + pt.cx + '" cy="' + pt.cy + '" r="' + pt.r + '" fill="currentColor"/>'; }).join('');
    return '';
  }

  function glyphMarkup(glyph, lookupPrimitive, lookupGlyph, depth) {
    depth = depth || 0;
    if (depth > 6 || !glyph.composition) return '';
    let out = '';
    glyph.composition.forEach(function (entry) {
      const pos = entry.position || [0.5, 0.5];
      const scale = (entry.scale === undefined) ? 1 : entry.scale;
      const rotation = entry.rotation || 0;
      const fx = pos[0] * 100, fy = pos[1] * 100;
      const transform = 'translate(' + fx + ',' + fy + ') rotate(' + rotation + ') scale(' + scale + ') translate(-50,-50)';
      let inner = '';
      if (entry.primitive) {
        const prim = lookupPrimitive(entry.primitive);
        inner = prim ? primitiveMarkup(prim) : '';
      } else if (entry.glyph) {
        const g = lookupGlyph(entry.glyph);
        inner = g ? glyphMarkup(g, lookupPrimitive, lookupGlyph, depth + 1) : '';
      }
      out += '<g transform="' + transform + '">' + inner + '</g>';
    });
    return out;
  }

  function svgWrap(inner) { return '<svg viewBox="0 0 100 100">' + inner + '</svg>'; }

  fetch('../language/gomsdu-glyphic-system.json')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      const lookupPrimitive = function (id) { return data.primitives.find(function (p) { return p.id === id; }); };
      const lookupGlyph = function (id) { return data.glyphs.find(function (g) { return g.id === id; }); };

      const gi = lookupGlyph('GI');
      const ka = lookupGlyph('KA');
      const mGlyph = lookupGlyph('M');
      const wGlyph = lookupGlyph('W');
      const yieldLine = lookupPrimitive('yield-line');

      if (gi) document.getElementById('slot-gi').innerHTML = svgWrap(glyphMarkup(gi, lookupPrimitive, lookupGlyph));
      if (ka) document.getElementById('slot-ka').innerHTML = svgWrap(glyphMarkup(ka, lookupPrimitive, lookupGlyph));

      // M and W are now formal Glyphs (North/South Facing Mark), built from
      // new-chevron-north/new-chevron-south — no more ad-hoc rotation hack.
      if (mGlyph) document.getElementById('slot-m').innerHTML = svgWrap(glyphMarkup(mGlyph, lookupPrimitive, lookupGlyph));
      if (wGlyph) document.getElementById('slot-w').innerHTML = svgWrap(glyphMarkup(wGlyph, lookupPrimitive, lookupGlyph));
      if (yieldLine) document.getElementById('slot-yield-line').innerHTML = svgWrap(primitiveMarkup(yieldLine));
    })
    .catch(function () {
      document.getElementById('receiving-box').textContent = 'Could not load the Glyphic System — serve this page from the project root.';
    });
</script>

</body>
</html>
